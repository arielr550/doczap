name: Tests

on:
  push:
    branches: [main]
    # Pushing a version tag such as v0.1.0 also publishes a GitHub Release.
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # The Homebrew Python on the macOS runners takes 35 seconds to resolve
  # 127.0.0.1, which the integration tests' local HTTP server does at startup.
  UV_MANAGED_PYTHON: "1"
  # The LibreOffice bundled into the Windows build: the mature "still" branch.
  LIBREOFFICE_BUILD: 26.2.6.3
  LIBREOFFICE_SHA256: f9877032fd908beb9c0ddf06df4af5c2e85f419c42e14876c4cce5aae5fb2660

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest supported Python and the newest one.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false

      - name: Install LibreOffice (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Install LibreOffice (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask libreoffice

      # The same pinned installer as the Windows app. Chocolatey's feed timed
      # out often enough to fail runs.
      - name: Cache the LibreOffice installer
        id: libreoffice-cache
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: libreoffice.msi
          key: libreoffice-${{ env.LIBREOFFICE_BUILD }}-win-x64

      - name: Download the LibreOffice installer
        if: runner.os == 'Windows' && steps.libreoffice-cache.outputs.cache-hit != 'true'
        shell: bash
        run: >
          curl -fsSL -o libreoffice.msi
          "https://downloadarchive.documentfoundation.org/libreoffice/old/${LIBREOFFICE_BUILD}/win/x86_64/LibreOffice_${LIBREOFFICE_BUILD}_Win_x86-64.msi"

      - name: Install LibreOffice (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "${LIBREOFFICE_SHA256}  libreoffice.msi" | sha256sum --check
          cmd //c "msiexec /i libreoffice.msi /qn /norestart"

      # The integration tests skip themselves when soffice is missing, so a
      # broken install would otherwise pass silently.
      - name: Check that LibreOffice is found
        run: uv run python -c "import sys; from doczap.converters.libreoffice import find_soffice; sys.exit(find_soffice() is None)"

      - name: Run tests
        # faulthandler prints a traceback if Tk crashes the interpreter.
        run: uv run python -X faulthandler -m unittest discover -s tests -v

      - name: Build the macOS app
        if: runner.os == 'macOS'
        run: uv run --group build python scripts/build_app.py

      - name: Convert with the packaged macOS app
        if: runner.os == 'macOS'
        run: uv run python scripts/check_app.py dist/DocZap.app/Contents/MacOS/DocZap

      # A missing module or data file makes the frozen app exit at once, so an
      # app still running after a few seconds has at least opened its window.
      - name: Check that the macOS app starts
        if: runner.os == 'macOS'
        run: |
          dist/DocZap.app/Contents/MacOS/DocZap &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "DocZap exited during startup"
            exit 1
          fi
          kill "$pid"

      - name: Check the macOS installer
        if: runner.os == 'macOS' && matrix.python == '3.14'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/DocZap-v0.1.0.zip" \
            https://github.com/arielr550/doczap/releases/download/v0.1.0/DocZap-macos-arm64.zip
          DOCZAP_TEST_ZIP="$PWD/dist/DocZap-macos-arm64.zip" \
            DOCZAP_PREVIOUS_ZIP="$RUNNER_TEMP/DocZap-v0.1.0.zip" \
            uv run python -m unittest discover -s tests -p test_installer_native.py -v

      - name: Upload the macOS app
        if: runner.os == 'macOS' && matrix.python == '3.14'
        uses: actions/upload-artifact@v7
        with:
          path: dist/DocZap-macos-arm64.zip
          archive: false
          if-no-files-found: error
          retention-days: 14


  # The portable Windows build, on a runner without LibreOffice installed, as
  # most users' PCs are: everything it needs has to come from the bundle.
  windows-app:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Cache the LibreOffice installer
        id: libreoffice-cache
        uses: actions/cache@v6
        with:
          path: libreoffice.msi
          key: libreoffice-${{ env.LIBREOFFICE_BUILD }}-win-x64

      - name: Download the LibreOffice installer
        if: steps.libreoffice-cache.outputs.cache-hit != 'true'
        shell: bash
        run: >
          curl -fsSL -o libreoffice.msi
          "https://downloadarchive.documentfoundation.org/libreoffice/old/${LIBREOFFICE_BUILD}/win/x86_64/LibreOffice_${LIBREOFFICE_BUILD}_Win_x86-64.msi"

      - name: Build the Windows app
        shell: bash
        run: |
          echo "${LIBREOFFICE_SHA256}  libreoffice.msi" | sha256sum --check
          uv run --group build python scripts/build_app.py --libreoffice-msi libreoffice.msi

      - name: Convert with the bundled LibreOffice
        shell: bash
        run: |
          export PATH="$PWD/dist/DocZap/LibreOffice/program:$PATH"
          uv run python -m unittest discover -s tests -p test_integration.py -v

      # LibreOffice's installer normally puts most of these fonts into
      # C:\Windows\Fonts, and OpenSymbol draws bullets. The bundle has to provide
      # them itself, or documents using them reflow.
      - name: Check that the bundled fonts are used
        shell: bash
        run: |
          export PATH="$PWD/dist/DocZap/LibreOffice/program:$PATH"
          uv run python - <<'EOF'
          import sys, tempfile, zipfile
          from pathlib import Path
          sys.path.insert(0, "tests")
          import test_integration as ti
          from doczap.conversion import convert_document

          # OpenSymbol has hardly any letters, so it gets bullet characters.
          samples = {"Carlito": "Carlito", "Caladea": "Caladea", "Liberation Serif": "Liberation", "OpenSymbol": "\u25cf\u2022\u25a0"}
          body = "".join(
              f'<w:p><w:r><w:rPr><w:rFonts w:ascii="{font}" w:hAnsi="{font}"/></w:rPr><w:t>{text}</w:t></w:r></w:p>'
              for font, text in samples.items()
          )
          document = ti.DOCUMENT.replace(
              "<w:p><w:r><w:t>Hello from DocZap</w:t></w:r></w:p>", body
          )
          with tempfile.TemporaryDirectory() as temp_dir:
              source = Path(temp_dir) / "fonts.docx"
              with zipfile.ZipFile(source, "w") as docx:
                  docx.writestr("[Content_Types].xml", ti.CONTENT_TYPES)
                  docx.writestr("_rels/.rels", ti.RELS)
                  docx.writestr("word/document.xml", document)
              pdf = convert_document(source).read_bytes()
          missing = [name for name in (b"Carlito", b"Caladea", b"LiberationSerif", b"OpenSymbol") if name not in pdf]
          print("missing fonts:", missing)
          sys.exit(1 if missing else 0)
          EOF

      - name: Check that the Windows app starts
        shell: pwsh
        run: |
          $app = Start-Process -FilePath dist\DocZap\DocZap.exe -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "DocZap exited during startup with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id

      - name: Convert with the packaged Windows app
        shell: pwsh
        run: uv run python scripts/check_app.py dist/DocZap/DocZap.exe

      - name: Upload the Windows app
        uses: actions/upload-artifact@v7
        with:
          path: dist/DocZap-windows-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: DocZap-*.zip
          path: dist
          merge-multiple: true
          # The artifacts are the release zips themselves; keep them zipped.
          skip-decompress: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/DocZap-macos-arm64.zip dist/DocZap-windows-x64.zip
          --title "DocZap $GITHUB_REF_NAME"
          --generate-notes
