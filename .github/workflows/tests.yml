name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The Homebrew Python on the macOS runners takes 35 seconds to resolve
  # 127.0.0.1, which the integration tests' local HTTP server does at startup.
  UV_MANAGED_PYTHON: "1"

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest supported Python and the newest one.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false

      - name: Install LibreOffice (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Install LibreOffice (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask libreoffice

      - name: Install LibreOffice (Windows)
        if: runner.os == 'Windows'
        run: choco install libreoffice-fresh --yes --no-progress

      # The integration tests skip themselves when soffice is missing, so a
      # broken install would otherwise pass silently.
      - name: Check that LibreOffice is found
        run: uv run python -c "import sys; from doczap.converters.libreoffice import find_soffice; sys.exit(find_soffice() is None)"

      - name: Run tests
        # faulthandler prints a traceback if Tk crashes the interpreter.
        run: uv run python -X faulthandler -m unittest discover -s tests -v

      - name: Build the macOS app
        if: runner.os == 'macOS'
        run: uv run --group build python scripts/build_app.py

      # A missing module or data file makes the frozen app exit at once, so an
      # app still running after a few seconds has at least opened its window.
      - name: Check that the macOS app starts
        if: runner.os == 'macOS'
        run: |
          dist/DocZap.app/Contents/MacOS/DocZap &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "DocZap exited during startup"
            exit 1
          fi
          kill "$pid"
