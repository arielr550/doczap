[project]
name = "doczap"
version = "0.2.1"
description = "Convert DOCX files to PDF and merge PDFs locally."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pypdf>=7.1.1,<8",
]

[project.scripts]
doczap = "doczap.cli:main"

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[dependency-groups]
# Only needed to build the desktop app: uv run --managed-python --group build ...
build = ["pyinstaller>=6.16", "pillow>=11"]
