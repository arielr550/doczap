[project]
name = "doczap"
version = "0.1.0"
description = "Fast, local, private document conversion that keeps the layout intact."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
doczap = "doczap.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
